<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>harmfulladvocado</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      content="Personal site of harmfulladvocado, a developer from Belgium building tools and open-source software."
      name="description"
    />
    <meta content="#060a07" name="theme-color" />
    <link href="/images/pfp.svg" rel="icon" type="image/svg" />
    <link href="/site.webmanifest" rel="manifest" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="/styles.css" rel="stylesheet" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme')
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <noscript>
      <main class="no-script">
        <h1>harmfulladvocado</h1>
        <p>Developer from Belgium building tools and open-source software.</p>
        <ul>
          <li><a href="https://github.com/harmfulladvocado">GitHub</a></li>
          <li><a href="https://minekot.org">MineKot</a></li>
          <li><a href="/llms.txt">LLM-friendly overview</a></li>
        </ul>
      </main>
    </noscript>
    <div id="app"></div>
    <script src="/index.js" type="module"></script>
  </body>
</html>
